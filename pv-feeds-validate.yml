name: PV Tube – validate feeds
on:
  workflow_dispatch:
  push:
    paths: [feeds.yaml, "PV/**"]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install feedparser requests pyyaml pytest
      - run: python -m pytest -q PV/test_pv_tube.py   # offline logic tests: no network, no AI cost
      - run: python PV/pv_tube.py --validate          # live check of every PV feed URL, no AI cost
