# ===========================================================================
# Behaviour + cost controls
# ===========================================================================
settings:
  lookback_hours: 30
  max_stories_per_category: 8
  min_sources_for_corroborated: 2

  hide_single_source: true      # global: drop <2-source stories, EXCEPT trust_single sources
  focus_mode: mostly_topics     # your topics fill the feed; Breaking News = reserved headlines
  headline_slots: 6             # how many Breaking News items to allow through
  interest_boost: 3.0
  cluster_similarity: 0.28

  monthly_cost_cap_usd: 3.00
  llm_provider: gemini
  # Pinned model instead of "gemini-flash-lite-latest": the -latest alias is hot-swapped by Google
  # to newer (pricier) Flash-Lite versions, which made the prices below — and the cost cap — wrong.
  gemini_model: gemini-3.1-flash-lite
  price_input_per_mtok: 0.25
  price_output_per_mtok: 1.50     # thinking tokens are billed at this rate too

  site_title: "Daily Briefing"
  site_url: ""

# Only these four categories. Order = display order on the page.
# (PV Tube is its own section rendered ABOVE these — configured in `pv_tube:` at the bottom.)
categories:
  - Breaking News
  - Business
  - Technology
  - Health

# ===========================================================================
# INTERESTS  ->  each maps a set of keywords to ONE category.
# A story is routed to the category of its highest-scoring interest.
# Edit keywords freely; prefer specific multi-word terms to avoid false matches.
# ===========================================================================
interests:
  # ---------- BUSINESS ----------
  - {name: Markets & indices, category: Business, keywords: [stock market, "s&p 500", sp500, nasdaq, dow jones, ftse, wall street, equities, bond yield, dividend, earnings report, stock exchange, wig20]}
  - {name: Macro & economy, category: Business, keywords: [inflation, interest rate, central bank, "the fed", federal reserve, ecb, gdp, recession, monetary policy, economic growth]}
  - {name: Crypto & blockchain, category: Business, keywords: [crypto, bitcoin, ethereum, blockchain, stablecoin, defi]}
  - {name: Currencies & FX, category: Business, keywords: [foreign exchange, exchange rate, "the dollar", the euro, zloty, currency market]}
  - {name: Oil & gas, category: Business, keywords: [oil price, crude oil, natural gas, opec, brent crude, lng]}
  - {name: Metals & commodities, category: Business, keywords: [copper price, lithium, industrial metals, iron ore, gold price, commodities]}
  - {name: Startups & funding, category: Business, keywords: [startup, raises funding, seed round, series a, series b, venture capital, valuation, ipo]}
  - {name: Companies & deals, category: Business, keywords: [merger, acquisition, takeover, quarterly profit, revenue growth, earnings call]}
  - {name: Poland economy, category: Business, weight: 1.5, keywords: [poland, polish, warsaw, zloty]}
  - {name: Trade & geopolitics, category: Business, keywords: [tariff, trade deal, sanction, export control, supply chain]}

  # ---------- TECHNOLOGY ----------
  - {name: AI & ML, category: Technology, keywords: [artificial intelligence, machine learning, chatgpt, openai, anthropic, deepmind, large language model, neural network, generative ai]}
  - {name: Chips & hardware, category: Technology, keywords: [semiconductor, nvidia, tsmc, asml, gpu, microchip, foundry, processor]}
  - {name: Cybersecurity, category: Technology, keywords: [cybersecurity, ransomware, data breach, malware, vulnerability, phishing, hacking, cyberattack]}
  - {name: Autonomous & space, category: Technology, keywords: [autonomous vehicle, self-driving, drone, robotics, spacex, nasa, satellite, rocket launch, space mission]}
  - {name: Cloud & infrastructure, category: Technology, keywords: [cloud computing, data center, on-premise, kubernetes, aws, azure, cloud infrastructure]}
  - {name: Big tech companies, category: Technology, keywords: [apple, microsoft, google, amazon, meta, nvidia, tesla, samsung]}

  # ---------- HEALTH (research only; gated to research sources below) ----------
  - {name: Medical research, category: Health, keywords: [clinical trial, peer-reviewed, research paper, study finds, published in, medical research, new treatment, drug trial, vaccine, findings]}

# ===========================================================================
# SOURCES  (verify URLs after first run; the report lists failures)
#   trust_single: true  -> may appear single-source, flagged (your Poland/startup lane)
#   research: true      -> counts as a vetted research outlet (required for Health)
# ===========================================================================
sources:
  # ---- Worldwide / Breaking ----
  - {name: NPR News, url: https://feeds.npr.org/1001/rss.xml}
  - {name: PBS NewsHour, url: https://www.pbs.org/newshour/feeds/rss/headlines}
  - {name: BBC News (World), url: https://feeds.bbci.co.uk/news/world/rss.xml}
  - {name: The Guardian (World), url: https://www.theguardian.com/world/rss}
  - {name: Deutsche Welle, url: https://rss.dw.com/rdf/rss-en-all}
  - {name: France 24, url: https://www.france24.com/en/rss}
  - {name: Al Jazeera, url: https://www.aljazeera.com/xml/rss/all.xml}
  - {name: NYT World, url: https://rss.nytimes.com/services/xml/rss/nyt/World.xml}
  - {name: South China Morning Post, weight: 0.8, url: https://www.scmp.com/rss/91/feed}
  - {name: China Daily, weight: 0.6, url: https://www.chinadaily.com.cn/rss/world_rss.xml}

  # ---- Business / markets / crypto ----
  - {name: BBC Business, url: https://feeds.bbci.co.uk/news/business/rss.xml}
  - {name: The Guardian (Business), url: https://www.theguardian.com/uk/business/rss}
  - {name: CNBC, weight: 0.8, url: 'https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=10000664'}
  - {name: CoinDesk, weight: 0.8, url: https://www.coindesk.com/arc/outboundfeeds/rss/}

  # ---- Technology / AI / cyber / space / cloud ----
  - {name: Ars Technica, weight: 0.9, trust_single: true, url: https://feeds.arstechnica.com/arstechnica/index}
  - {name: Ars Technica (AI), weight: 0.9, trust_single: true, url: https://arstechnica.com/ai/feed/}
  - {name: The Verge, weight: 0.9, trust_single: true, url: https://www.theverge.com/rss/index.xml}
  - {name: The Guardian (Technology), url: https://www.theguardian.com/uk/technology/rss}
  - {name: MIT Technology Review, trust_single: true, url: https://www.technologyreview.com/feed/}
  - {name: The Hacker News, weight: 0.8, trust_single: true, url: https://feeds.feedburner.com/TheHackersNews}
  - {name: BleepingComputer, weight: 0.8, trust_single: true, url: https://www.bleepingcomputer.com/feed/}
  - {name: Krebs on Security, weight: 0.9, trust_single: true, url: https://krebsonsecurity.com/feed/}
  - {name: NASA, weight: 0.9, trust_single: true, url: https://www.nasa.gov/feed/}
  - {name: Space.com, weight: 0.8, trust_single: true, url: https://www.space.com/feeds/all}

  # ---- Poland / EU-startup trusted lane (single-source OK, flagged) ----
  - {name: Notes from Poland, weight: 1.2, trust_single: true, url: https://notesfrompoland.com/feed/}
  - {name: Sifted, weight: 1.0, trust_single: true, url: https://sifted.eu/feed}
  - {name: EU-Startups, weight: 1.0, trust_single: true, url: https://www.eu-startups.com/feed/}
  - {name: Silicon Canals, weight: 0.9, trust_single: true, url: https://siliconcanals.com/feed/}

  # ---- Health / research (research:true required for Health category) ----
  - {name: Nature News, research: true, url: https://www.nature.com/nature.rss}
  - {name: ScienceDaily (Health), research: true, url: https://www.sciencedaily.com/rss/health_medicine.xml}
  - {name: EurekAlert (Medicine), research: true, url: https://www.eurekalert.org/rss/medicine_health.xml}

# ===========================================================================
# MARKETS PANEL  (top companies by market cap, rendered at the top of the page)
# provider: yfinance (no key, covers US+EU+Poland) | finnhub (needs FINNHUB_API_KEY,
#           US-only on free tier) | none (off). Regions kept single-currency so the
# ranking is apples-to-apples without FX conversion.
# ===========================================================================
markets:
  enabled: true
  provider: yfinance
  regions:
    - name: "US (USD)"
      currency: "$"
      symbols:
        - {sym: AAPL,  name: Apple}
        - {sym: MSFT,  name: Microsoft}
        - {sym: NVDA,  name: Nvidia}
        - {sym: GOOGL, name: Alphabet}
        - {sym: AMZN,  name: Amazon}
        - {sym: META,  name: Meta}
    - name: "Europe (EUR)"
      currency: "€"
      symbols:
        - {sym: ASML.AS, name: ASML}
        - {sym: SAP.DE,  name: SAP}
        - {sym: MC.PA,   name: LVMH}
        - {sym: TTE.PA,  name: TotalEnergies}
        - {sym: SIE.DE,  name: Siemens}
        - {sym: OR.PA,   name: L'Oréal}
    - name: "Poland (PLN)"
      currency: "zł"
      symbols:
        - {sym: PKN.WA, name: Orlen}
        - {sym: PKO.WA, name: PKO BP}
        - {sym: PEO.WA, name: Pekao}
        - {sym: PZU.WA, name: PZU}
        - {sym: KGH.WA, name: KGHM}
        - {sym: ALE.WA, name: Allegro}
        - {sym: DNP.WA, name: Dino}
        - {sym: CDR.WA, name: CD Projekt}

# ===========================================================================
# PV TUBE  (photovoltaics · energy storage · inverters — EU / Asia / US)
# Rendered ABOVE the categories. Uses the SAME llm_provider, model, prices and
# API key as `settings` above — no second AI account. Read by pv_tube.py.
# ===========================================================================
pv_tube:
  enabled: true
  timezone: Europe/Warsaw
  window_hours: 36                 # daily run + overlap; repeats are suppressed by the "shown" log
  max_per_region: 3                # reading-fatigue cap → max 9 stories in the section
  max_entries_per_feed: 40
  fetch_timeout_s: 15
  cluster_similarity: 0.28
  dead_feed_after_runs: 3          # one warning per dead feed, re-armed after it recovers

  eu_include_wider_europe: true    # UK, Norway, Switzerland, Ukraine counted under EU
  asia_include_gulf: false         # Saudi/UAE/Oman/Qatar/Israel excluded from Asia

  max_output_tokens: 2500          # bounds worst-case cost per call
  max_sources_per_story: 2
  chars_per_source: 900            # bounds input cost
  monthly_cost_cap_usd: 0.30       # sub-cap INSIDE the 3.00 above; hit → extractive mode, page still builds

  # owner = newsroom/company. Corroboration (🟢) needs 2+ DIFFERENT owners.
  # region: home region for regional outlets; null = global outlet (region read from the text).
  sources:
    # ── Global trade press ──
    - {name: pv magazine,          url: "https://www.pv-magazine.com/feed/",        owner: pv-magazine-group, region: null, lang: en, trust_single: true}
    - {name: PV Tech,              url: "https://www.pv-tech.org/feed/",            owner: solar-media,       region: null, lang: en, trust_single: true}
    - {name: Energy-Storage.news,  url: "https://www.energy-storage.news/feed/",    owner: solar-media,       region: null, lang: en, trust_single: true}
    # ── EU / Poland ──
    - {name: Gramwzielone.pl,      url: "https://www.gramwzielone.pl/rss",          owner: gramwzielone,      region: EU,   lang: pl, trust_single: true}
    - {name: WysokieNapiecie.pl,   url: "https://wysokienapiecie.pl/feed/",         owner: wysokienapiecie,   region: EU,   lang: pl, trust_single: true}
    # ── Asia ──
    - {name: pv magazine India,    url: "https://www.pv-magazine-india.com/feed/",  owner: pv-magazine-group, region: Asia, lang: en, trust_single: true}
    - {name: Mercom India,         url: "https://www.mercomindia.com/feed",         owner: mercom,            region: Asia, lang: en, trust_single: true}
    # ── US ──
    - {name: pv magazine USA,      url: "https://pv-magazine-usa.com/feed/",        owner: pv-magazine-group, region: US,   lang: en, trust_single: true}
    - {name: Solar Power World,    url: "https://www.solarpowerworldonline.com/feed/", owner: wtwh-media,     region: US,   lang: en, trust_single: true}
    - {name: Utility Dive,         url: "https://www.utilitydive.com/feeds/news/",  owner: industry-dive,     region: US,   lang: en, trust_single: true}
    - {name: EIA Today in Energy,  url: "https://www.eia.gov/rss/todayinenergy.xml", owner: us-eia,           region: US,   lang: en, trust_single: true}
