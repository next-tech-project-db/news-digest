# ── Paste this block into feeds.yaml (top level) ─────────────────────────────
pv_tube:
  enabled: true
  timezone: Europe/Warsaw
  window_hours: 36                 # daily run + overlap; repeats are suppressed by the "shown" log
  max_per_region: 3                # reading-fatigue cap → max 9 stories in the section
  max_entries_per_feed: 40
  fetch_timeout_s: 15
  cluster_similarity: 0.28         # same value as the main digest
  dead_feed_after_runs: 3          # one warning per dead feed, re-armed after it recovers

  # Region rules (trade-offs, change freely)
  eu_include_wider_europe: true    # UK, Norway, Switzerland, Ukraine counted under EU
  asia_include_gulf: false         # Saudi/UAE/Oman/Qatar/Israel — off = "Asia" means South/East/Central Asia

  # AI — separate sub-cap INSIDE the global monthly_cost_cap_usd: 3.00
  model: claude-haiku-4-5-20251001
  price_in_per_mtok: 1.00          # verify against Anthropic pricing page if the model changes
  price_out_per_mtok: 5.00
  max_output_tokens: 2500          # bounds worst-case output cost per call
  max_sources_per_story: 2
  chars_per_source: 900            # bounds input cost
  monthly_cost_cap_usd: 0.75       # hard stop → extractive mode, digest still builds

  # owner = newsroom/company. Corroboration (🟢) needs 2+ DIFFERENT owners.
  # region = home region for regional outlets; null = global outlet (region decided from text,
  #          dropped if the text names no EU/Asia/US geography).
  # All URLs must pass `python pv_tube.py --validate` before relying on them.
  sources:
    # ── Global trade press ──
    - {name: pv magazine,          url: "https://www.pv-magazine.com/feed/",        owner: pv-magazine-group, region: null, lang: en, trust_single: true}
    - {name: PV Tech,              url: "https://www.pv-tech.org/feed/",            owner: solar-media,       region: null, lang: en, trust_single: true}
    - {name: Energy-Storage.news,  url: "https://www.energy-storage.news/feed/",    owner: solar-media,       region: null, lang: en, trust_single: true}
    # ── EU / Poland ──
    - {name: Gramwzielone.pl,      url: "https://www.gramwzielone.pl/rss",          owner: gramwzielone,      region: EU,   lang: pl, trust_single: true}
    - {name: WysokieNapiecie.pl,   url: "https://wysokienapiecie.pl/feed/",         owner: wysokienapiecie,   region: EU,   lang: pl, trust_single: true}
    # ── Asia ──
    - {name: pv magazine India,    url: "https://www.pv-magazine-india.com/feed/",  owner: pv-magazine-group, region: Asia, lang: en, trust_single: true}
    - {name: Mercom India,         url: "https://www.mercomindia.com/feed",         owner: mercom,            region: Asia, lang: en, trust_single: true}
    # ── US ──
    - {name: pv magazine USA,      url: "https://pv-magazine-usa.com/feed/",        owner: pv-magazine-group, region: US,   lang: en, trust_single: true}
    - {name: Solar Power World,    url: "https://www.solarpowerworldonline.com/feed/", owner: wtwh-media,     region: US,   lang: en, trust_single: true}
    - {name: Utility Dive,         url: "https://www.utilitydive.com/feeds/news/",  owner: industry-dive,     region: US,   lang: en, trust_single: true}
    - {name: EIA Today in Energy,  url: "https://www.eia.gov/rss/todayinenergy.xml", owner: us-eia,           region: US,   lang: en, trust_single: true}
