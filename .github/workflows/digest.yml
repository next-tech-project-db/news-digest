name: news-digest

on:
  schedule:
    - cron: "0 6 * * *"        # 06:00 UTC daily. For weekly: "0 6 * * 1" (Mondays)
  workflow_dispatch: {}          # lets you run it on demand from the Actions tab

permissions:
  contents: write                # to commit the running spend state back
  pages: write                   # to publish the feed
  id-token: write

concurrency:
  group: news-digest
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Run digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}   # optional; omit to run $0
        run: python news_digest.py

      - name: Persist monthly spend state
        run: |
          git config user.name "digest-bot"
          git config user.email "digest-bot@users.noreply.github.com"
          git add state.json || true
          git commit -m "chore: update spend state [skip ci]" || echo "no state change"
          git push || echo "nothing to push"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
